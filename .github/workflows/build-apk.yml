name: 构建可安装包

# 每次推 main：云端构建 Android Release APK，并更新到一个固定的预发布（prerelease）
# 页面。GitHub Release 的附件是公开直链，不用登录、不会 90 天过期，适合发给别人装。
# iOS 包只在手动触发且勾选时构建：没有 Apple 签名凭据，产物装不上真机。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: 同时构建 iPad 包（无签名，仅用于后续自己签名，不能直接安装）
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 恢复 gradle wrapper jar（二进制，未纳入版本库）
        run: |
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          ls -la android/gradle/wrapper/

      - name: 生成占位应用图标（二进制 PNG，云端重建）
        run: |
          cd android/app/src/main/res
          for spec in mdpi 48 hdpi 72 xhdpi 96 xxhdpi 144 xxxhdpi 192; do
            dir=$(echo $spec | cut -d' ' -f1)
            size=$(echo $spec | cut -d' ' -f2)
            convert -size ${size}x${size} xc:'#1a1a1a' "mipmap-$dir/ic_launcher.png"
            echo "icon $dir $size done"
          done

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Release APK（按 ABI 拆分 + 通用包）
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: 记录产物校验和
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          sha256sum app-*-release.apk > "$GITHUB_WORKSPACE/apk-sha256.txt"
          cat "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: 上传 Actions 产物（需登录下载，默认保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: timenote-release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: 更新公开预发布 dev-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=dev-build
          APK_DIR=build/app/outputs/flutter-apk
          NOTES="随 \`main\` 分支每次推送自动覆盖，最新提交：\`${GITHUB_SHA:0:7}\`（Flutter $FLUTTER_VERSION，Release 构建，debug keystore 签名）。

          - \`app-arm64-v8a-release.apk\`：近十年的平板/手机，优先装这个
          - \`app-armeabi-v7a-release.apk\`：只有很老的 32 位设备才需要
          - \`app-release.apk\`：不区分 ABI 的通用包，体积最大

          安装：允许「来自未知来源的应用」后直接点开 APK，或 \`adb install app-arm64-v8a-release.apk\`。
          签名用的是 debug keystore，能装能自用，但不能上传 Google Play。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease \
              --title "开发版安装包（随 main 自动更新）" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease \
              --title "开发版安装包（随 main 自动更新）" --notes "$NOTES"
          fi
          gh release upload "$TAG" --clobber \
            "$APK_DIR"/app-arm64-v8a-release.apk \
            "$APK_DIR"/app-armeabi-v7a-release.apk \
            "$APK_DIR"/app-release.apk \
            apk-sha256.txt
          gh release view "$TAG" --json tagName,prerelease,assets \
            --jq '{tag: .tagName, prerelease: .prerelease, assets: [.assets[].name]}'

  ios:
    # 手动触发且勾上 ios 才跑，避免每次 push 都消耗 macOS 分钟数
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ios == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 iPad 包（跳过签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 Runner.app
        run: |
          cd build/ios/iphoneos
          ls -la
          zip -qr "$GITHUB_WORKSPACE/timenote-unsigned-Runner.app.zip" Runner.app

      - name: 上传未签名产物
        uses: actions/upload-artifact@v4
        with:
          name: timenote-ios-unsigned
          path: timenote-unsigned-Runner.app.zip
          if-no-files-found: error
