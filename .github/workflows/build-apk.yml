name: 构建可安装包

# 每次推 main：云端构建 Android Release APK，并更新到一个固定的预发布（prerelease）
# 页面。GitHub Release 的附件是公开直链，不用登录、不会 90 天过期，适合发给别人装。
# 推 `v*` 标签：同一套构建流程另发一个**正式版** Release（不打 prerelease）。
# iOS 包只在手动触发且勾选时构建：没有 Apple 签名凭据，产物装不上真机。

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ios:
        description: 同时构建 iPad 包（无签名，仅用于后续自己签名，不能直接安装）
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  android:
    # 标签推送交给下面的 release 作业，这里别跟着把 dev-build 覆盖一遍
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Release APK（按 ABI 拆分 + 通用包）
        run: |
          # BUILD_SHA 是设置页「检查更新」的比对基准：App 里 const 读不到就报
          # 「本地构建，比对不了」，所以这两行少了参数构建照样成功，只是功能哑掉。
          flutter build apk --release --split-per-abi \
            --dart-define=BUILD_SHA=$GITHUB_SHA
          flutter build apk --release \
            --dart-define=BUILD_SHA=$GITHUB_SHA

      - name: 记录产物校验和
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          # 逐个点名，不用 app-*-release.apk：那个 glob 匹配不到通用包
          # app-release.apk（app- 之后还需要一个字面的 -release.apk）
          sha256sum app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
            app-x86_64-release.apk app-release.apk > "$GITHUB_WORKSPACE/apk-sha256.txt"
          cat "$GITHUB_WORKSPACE/apk-sha256.txt"
          # 纯文本完整 SHA：App 拿它比对（走 Releases 附件，不碰有 IP 限流的 API）
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/dev-build-sha.txt"

      - name: 上传 Actions 产物（需登录下载，默认保留 90 天）
        uses: actions/upload-artifact@v4
        with:
          name: timenote-release-apk
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: 更新公开预发布 dev-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=dev-build
          APK_DIR=build/app/outputs/flutter-apk
          NOTES="随 \`main\` 分支每次推送自动覆盖，最新提交：\`${GITHUB_SHA:0:7}\`（Flutter $FLUTTER_VERSION，Release 构建，debug keystore 签名）。

          - \`app-arm64-v8a-release.apk\`：近十年的平板/手机，优先装这个
          - \`app-armeabi-v7a-release.apk\`：只有很老的 32 位设备才需要
          - \`app-x86_64-release.apk\`：x86_64 模拟器 / Chromebook 才需要，真机基本用不上
          - \`app-release.apk\`：不区分 ABI 的通用包，体积最大
          - \`apk-sha256.txt\` / \`dev-build-sha.txt\`：四个包的校验和 / 这一版对应的完整 commit（设置页「检查更新」读的就是后者）

          安装：允许「来自未知来源的应用」后直接点开 APK，或 \`adb install app-arm64-v8a-release.apk\`。
          签名用的是 debug keystore，能装能自用，但不能上传 Google Play。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease \
              --title "开发版安装包（随 main 自动更新）" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease \
              --title "开发版安装包（随 main 自动更新）" --notes "$NOTES"
          fi
          # --clobber 是「先删同名附件、再传新的」，删和传不是原子的；中途失败就会把已经删掉的那几个
          # 留在空中。run #17 实测：arm64 与 x86_64 的删除已经成功、删 v7a（asset 713954948）时
          # GitHub 回 HTTP 500，整步中断 → 发布页只剩 4 个附件，平板优先装的 arm64 直接 404。
          # 所以：重试 + 传完逐个点名核对，缺就继续重试，三次仍不齐才把 run 判红。
          ASSET_NAMES=(
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-x86_64-release.apk
            app-release.apk
            apk-sha256.txt
            dev-build-sha.txt
          )
          for attempt in 1 2 3; do
            missing=""
            if gh release upload "$TAG" --clobber \
                "$APK_DIR/app-arm64-v8a-release.apk" \
                "$APK_DIR/app-armeabi-v7a-release.apk" \
                "$APK_DIR/app-x86_64-release.apk" \
                "$APK_DIR/app-release.apk" \
                apk-sha256.txt dev-build-sha.txt; then
              have=" $(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")') "
              for want in "${ASSET_NAMES[@]}"; do
                case "$have" in *" $want "*) ;; *) missing="$missing $want";; esac
              done
            else
              missing=" (gh release upload 这一步本身失败)"
            fi
            if [ -z "$missing" ]; then
              echo "dev-build 附件核对通过：$have"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::dev-build 重试 3 次仍缺附件：$missing"
              exit 1
            fi
            echo "第 $attempt 次发布后还缺：$missing —— 20 秒后重试"
            sleep 20
          done
          # 这句只是把结果打印到日志，附件传完之后再失败也不该把整个 run 拖红。
          # run #9 就是挂在这里（发布本身成功），根因由 run #10 的 annotation 交出来：
          # `--json prerelease` 是错的字段名，gh 只认 isPrerelease。
          # 写成 annotation 而不是丢日志，是因为 annotations 接口免登录可读，日志下载却要 admin 权限。
          if summary=$(gh release view "$TAG" --json tagName,isPrerelease,assets \
              --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}' 2>&1); then
            echo "$summary"
          else
            # 先 tr 掉换行（workflow command 的值必须是单行），再把 % 转义成 %25：
            # 顺序反了会把刚插进的 %25 又转一遍，annotation 里就多出个假数字。
            msg=$(printf '%s' "$summary" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::warning::dev-build 已发布（附件见 Releases 页），但自检打印失败：$msg"
          fi

  release:
    # 只有推 v* 标签才跑：给这个标签单独出一份包，发成正式版（Latest）。
    # 不复用 dev-build 的附件，是为了让「v1.0.0 的包」和「v1.0.0 这个提交」严格对得上；
    # debug keystore 每轮现生成，同一份代码两轮的 sha256 本来就不一样，只能同轮自比。
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

      - name: 构建 Release APK（按 ABI 拆分 + 通用包）
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=BUILD_SHA=$GITHUB_SHA
          flutter build apk --release \
            --dart-define=BUILD_SHA=$GITHUB_SHA

      - name: 记录产物校验和
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-arm64-v8a-release.apk app-armeabi-v7a-release.apk \
            app-x86_64-release.apk app-release.apk > "$GITHUB_WORKSPACE/apk-sha256.txt"
          cat "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: 发布正式版 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          {
            printf '对应提交 `%s`（Flutter %s，Release 构建，debug keystore 签名）。\n\n' \
              "${GITHUB_SHA:0:7}" "$FLUTTER_VERSION"
            cat RELEASE-NOTES.md
          } > "$GITHUB_WORKSPACE/release-notes.md"
          gh release create "$TAG" --title "时笺 TimeNote $TAG（Android 可安装包）" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" --latest
          gh release upload "$TAG" --clobber \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            apk-sha256.txt
          # 打印失败不该把整个 run 拖红（dev-build 那一轮就是栽在这句话上）
          if summary=$(gh release view "$TAG" --json tagName,isPrerelease,assets \
              --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}' 2>&1); then
            echo "$summary"
          else
            msg=$(printf '%s' "$summary" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::warning::$TAG 已发布（附件见 Releases 页），但自检打印失败：$msg"
          fi

  ios:
    # 手动触发且勾上 ios 才跑，避免每次 push 都消耗 macOS 分钟数
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ios == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 iPad 包（跳过签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 Runner.app
        run: |
          cd build/ios/iphoneos
          ls -la
          zip -qr "$GITHUB_WORKSPACE/timenote-unsigned-Runner.app.zip" Runner.app

      - name: 上传未签名产物
        uses: actions/upload-artifact@v4
        with:
          name: timenote-ios-unsigned
          path: timenote-unsigned-Runner.app.zip
          if-no-files-found: error
