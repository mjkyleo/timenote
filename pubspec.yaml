name: timenote
description: "时笺 TimeNote - 平板离线翻页时钟，专注计时 + 待办抽屉 + 倒计时彩蛋"
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  wakelock_plus: ^1.2.4
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^4.0.0
  wakelock_plus_platform_interface: ^1.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quotes.json
    - assets/audio/alert.wav
